{% extends "base.html" %} {% block title %}Create Request - Vectris{% endblock
%} {% block content %}
<div class="page">
  <section class="panel">
    <h2>Create Transport Request</h2>

    <form method="post" action="/create-request">
      <div class="field">
        <label for="patient_name">Patient Name</label>
        <input type="text" id="patient_name" name="patient_name" required />
      </div>

      <div class="field">
        <label for="origin_department">Origin Department</label>
        <select id="origin_department" name="origin_department" required>
          <option value="">-- Select --</option>
          {% for dept in departments %}
          <option value="{{ dept }}">{{ dept }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="field">
        <label for="origin_room">Origin Room</label>
        <input type="text" id="origin_room" name="origin_room" required />
      </div>

      <div class="field">
        <label for="destination_department">Destination Department</label>
        <select
          id="destination_department"
          name="destination_department"
          required
        >
          <option value="">-- Select --</option>
          {% for dept in departments %}
          <option value="{{ dept }}">{{ dept }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="field">
        <label for="equipment_needed">Equipment Needed</label>
        <select id="equipment_needed" name="equipment_needed">
          <option value="">None</option>
          {% for item in equipment_options %}
          <option value="{{ item }}">{{ item }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="field-checkbox">
        <input type="checkbox" id="biohazard" name="biohazard" value="true" />
        <label for="biohazard">Biohazard Precautions Required</label>
      </div>

      <div class="field">
        <label for="transporters_required">Transporters Required</label>
        <input
          type="number"
          id="transporters_required"
          name="transporters_required"
          value="1"
          min="1"
          required
        />
      </div>

      <button class="btn-submit" type="submit">Submit Request</button>
    </form>

    <a class="back-link" href="/dashboard">&larr; Back to Dashboard</a>
  </section>
</div>
{% endblock %}
